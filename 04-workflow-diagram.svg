<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bottleneckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171" />
    </marker>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="940" height="70" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="50" font-size="22" font-weight="bold" fill="url(#titleGrad)">VIN SMART FUTURE — CURRENT-STATE WORKFLOW MAPPING</text>
  <text x="50" y="73" font-size="14" fill="#94a3b8">Bài toán: Xanh SM Cứu hộ sạc pin thực địa | Tổng thời gian thủ công: 15-17 phút/lượt</text>

  <!-- Legend -->
  <g transform="translate(680, 32)">
    <rect x="0" y="0" width="270" height="46" rx="8" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <circle cx="20" cy="23" r="8" fill="#ef4444"/>
    <text x="35" y="27" font-size="12" fill="#f87171" font-weight="bold">🔴 Bottleneck (Nghẽn)</text>
    <circle cx="150" cy="23" r="8" fill="#38bdf8"/>
    <text x="165" y="27" font-size="12" fill="#7dd3fc" font-weight="bold">🔄 Handoff</text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(40, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="150" rx="10" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="15" y="15" width="70" height="24" rx="12" fill="#0284c7"/>
    <text x="50" y="31" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Bước 1</text>
    <text x="245" y="31" font-size="12" fill="#38bdf8" font-weight="bold" text-anchor="end">⏱ 2 phút</text>
    <text x="15" y="65" font-size="16" fill="#f8fafc" font-weight="bold">Nhận cuộc gọi báo sự cố</text>
    <text x="15" y="90" font-size="13" fill="#cbd5e1">Ai: Dispatcher</text>
    <text x="15" y="110" font-size="12" fill="#94a3b8">In: Cuộc gọi từ Tài xế Xanh SM</text>
    <text x="15" y="128" font-size="12" fill="#94a3b8">Out: Thông tin sự cố &amp; Biển số</text>
  </g>

  <!-- Handoff 1 Arrow -->
  <path d="M 300 205 L 360 205" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="305" y="175" width="50" height="20" rx="4" fill="#0369a1"/>
  <text x="330" y="189" font-size="11" fill="#e0f2fe" font-weight="bold" text-anchor="middle">🔄 H1</text>

  <!-- Step 2 -->
  <g transform="translate(370, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="150" rx="10" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="15" y="15" width="70" height="24" rx="12" fill="#0284c7"/>
    <text x="50" y="31" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Bước 2</text>
    <text x="245" y="31" font-size="12" fill="#38bdf8" font-weight="bold" text-anchor="end">⏱ 2 phút</text>
    <text x="15" y="65" font-size="16" fill="#f8fafc" font-weight="bold">Tra cứu GPS của xe</text>
    <text x="15" y="90" font-size="13" fill="#cbd5e1">Ai: Dispatcher</text>
    <text x="15" y="110" font-size="12" fill="#94a3b8">In: Biển số xe / ID tài xế</text>
    <text x="15" y="128" font-size="12" fill="#94a3b8">Out: Toạ độ GPS thực tế</text>
  </g>

  <!-- Handoff 2 Arrow -->
  <path d="M 630 205 L 690 205" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <rect x="635" y="175" width="50" height="20" rx="4" fill="#991b1b"/>
  <text x="660" y="189" font-size="11" fill="#fecaca" font-weight="bold" text-anchor="middle">🔄 H2</text>

  <!-- Step 3 (BOTTLENECK) -->
  <g transform="translate(700, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="150" rx="10" fill="url(#bottleneckGrad)" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="15" y="15" width="70" height="24" rx="12" fill="#dc2626"/>
    <text x="50" y="31" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Bước 3</text>
    <text x="245" y="31" font-size="12" fill="#fca5a5" font-weight="bold" text-anchor="end">⏱ 5 min 🔴</text>
    <text x="15" y="65" font-size="16" fill="#ffffff" font-weight="bold">Tra cứu trạm sạc trống</text>
    <text x="15" y="90" font-size="13" fill="#fecaca">Ai: Dispatcher (Thủ công)</text>
    <text x="15" y="110" font-size="12" fill="#fee2e2">In: Toạ độ GPS xe</text>
    <text x="15" y="128" font-size="12" fill="#fee2e2">Out: Địa chỉ trạm VinFast</text>
    <!-- Warning Badge -->
    <rect x="145" y="12" width="105" height="24" rx="4" fill="#b91c1c"/>
    <text x="197" y="28" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">🔴 BOTTLENECK</text>
  </g>

  <!-- Vertical Arrow Step 3 to Step 4 -->
  <path d="M 830 280 L 830 350" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <!-- Step 4 (BOTTLENECK) -->
  <g transform="translate(700, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="150" rx="10" fill="url(#bottleneckGrad)" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="15" y="15" width="70" height="24" rx="12" fill="#dc2626"/>
    <text x="50" y="31" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Bước 4</text>
    <text x="245" y="31" font-size="12" fill="#fca5a5" font-weight="bold" text-anchor="end">⏱ 5 min 🔴</text>
    <text x="15" y="65" font-size="16" fill="#ffffff" font-weight="bold">Soạn tin nhắn chỉ đường</text>
    <text x="15" y="90" font-size="13" fill="#fecaca">Ai: Dispatcher (Gõ SMS/App)</text>
    <text x="15" y="110" font-size="12" fill="#fee2e2">In: Địa chỉ &amp; Hướng đi</text>
    <text x="15" y="128" font-size="12" fill="#fee2e2">Out: SMS / App Driver</text>
    <rect x="145" y="12" width="105" height="24" rx="4" fill="#b91c1c"/>
    <text x="197" y="28" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">🔴 BOTTLENECK</text>
  </g>

  <!-- Arrow Step 4 to Step 5 -->
  <path d="M 700 435 L 630 435" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="635" y="405" width="50" height="20" rx="4" fill="#0369a1"/>
  <text x="660" y="419" font-size="11" fill="#e0f2fe" font-weight="bold" text-anchor="middle">🔄 H3</text>

  <!-- Step 5 (Mobile Charger / Rescue) -->
  <g transform="translate(370, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="150" rx="10" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="15" y="15" width="70" height="24" rx="12" fill="#0284c7"/>
    <text x="50" y="31" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Bước 5</text>
    <text x="245" y="31" font-size="12" fill="#38bdf8" font-weight="bold" text-anchor="end">⏱ 3 phút</text>
    <text x="15" y="65" font-size="16" fill="#f8fafc" font-weight="bold">Gọi xe sạc di động</text>
    <text x="15" y="90" font-size="13" fill="#cbd5e1">Điều kiện: Nếu Pin &lt; 5%</text>
    <text x="15" y="110" font-size="12" fill="#94a3b8">In: Vị trí xe hết pin</text>
    <text x="15" y="128" font-size="12" fill="#94a3b8">Out: Lệnh điều xe cứu hộ</text>
  </g>

  <!-- Summary Box -->
  <g transform="translate(40, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="290" height="150" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="20" y="35" font-size="14" fill="#a5b4fc" font-weight="bold">📊 WORKFLOW METRICS SUMMARY</text>
    <text x="20" y="65" font-size="13" fill="#e2e8f0">• Tổng thời gian thủ công: <tspan fill="#f87171" font-weight="bold">15 - 17 phút</tspan></text>
    <text x="20" y="90" font-size="13" fill="#e2e8f0">• Điểm nghẽn lớn nhất: <tspan fill="#f87171" font-weight="bold">Bước 3 &amp; Bước 4</tspan></text>
    <text x="20" y="115" font-size="13" fill="#e2e8f0">• Mục tiêu sau khi dùng AI: <tspan fill="#4ade80" font-weight="bold">&lt; 2 phút/lượt</tspan></text>
  </g>
</svg>

